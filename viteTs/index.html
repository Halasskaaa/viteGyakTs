<!doctype html>
<html lang="hun">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vitets</title>
  </head>
  <body>
    <h1>Measurements</h1>

    <h2>New measurements</h2>

    <form id="newdataform">
      <div class="mb-3">
        <label for="inputName" class="label">Name</label>
        <input type="text" name="name" id="inputName" class="form-control">
      </div>

      <div class="mb-3">
        <label for="inputGender" class="label">Gender</label>
        <select name="gender" id="inputGender" class="form-control">
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value=" ">N/A</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="inputHeight" class="label">Height</label>
        <input type="number" name="height" id="inputHeight" class="form-control">
      </div>



      <div class="mb-3">
        <button type="submit" class="btn btn-primary">Measure</button>
      </div>
    </form>

    <table class="table">
      <thead>
        <th>Name</th>
        <th>Gender</th>
        <th>Height</th>
        <th>Date</th>
      </thead>
      <tbody id="content">

      </tbody>
    </table>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
