<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css">
    <title>Élménytúra</title>
  </head>
  <body>

    <h1>Élménytúra jegyrendelés</h1>

    <form id="urlap">
      
      <label for="name">Név:</label>
      <input type="text" id="name" required>

      <br><br>

      <label for="events">Esemény:</label>
      <select id="events" required>
        <option value="" disabled selected>Válassz eseményt...</option>
      </select>

      <br><br>

      <label for="db">Darab:</label>
      <input type="number" id="db" min="1" required>

      <br><br>

      <input type="submit" value="Hozzáadás">

    </form>

    <br><br>

    <table id="tabla">
      <thead>
        <tr>
          <th>Név</th>
          <th>Esemény neve (zárójelben a jegyek száma)</th>
          <th>Ár</th>
        </tr>
      </thead>

      <tbody></tbody>

      <tfoot>
        <tr>
          <td colspan="2"><strong>Végösszeg:</strong></td>
          <td id="vegosszeg">0 Ft</td>
        </tr>
      </tfoot>
    </table>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
